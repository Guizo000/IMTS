services:
  referencia:
      build:
        context: .
        dockerfile: ServidorPy/Dockerfile
      image: referencia
      volumes:
        - ./ServidorPy/referencia.py:/app/main.py
      ports:
        - 5559:5559

  proxy:
    build:
      context: .
      dockerfile: ServidorPy/Dockerfile
    image: proxy
    volumes:
      - ./ServidorPy/proxy.py:/app/main.py
    ports:
      - 5557:5557
      - 5558:5558

  broker:
    build:
      context: .
      dockerfile: ServidorPy/Dockerfile
    image: broker
    volumes:
      - ./ServidorPy/broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  servidorpy:
    build:
      context: .
      dockerfile: ServidorPy/Dockerfile
    image: servidorpy
    volumes:
      - ./ServidorPy/servidor.py:/app/main.py
      - ./ServidorPy/armazenamento.py:/app/armazenamento.py
      - ./ServidorPy/modulos:/app/modulos
      - ./dados:/dados
    expose:
      - "6000"
    depends_on:
      - broker
      - proxy
      - referencia
    deploy:
      replicas: 2

  servidorcs:
    build:
      context: .
      dockerfile: ServidorCS/Dockerfile
    image: servidorcs
    volumes:
      - ./dados:/dados
    expose:
      - "6000"
    depends_on:
      - broker
      - proxy
      - referencia
    deploy:
      replicas: 2

  clientecs:
    build:
      context: .
      dockerfile: ClienteCs/Dockerfile
    image: clientecs
    depends_on:
      - servidorpy
      - servidorcs
    environment:
      - SERVIDOR_ENDERECO=tcp://broker:5555
      - PROXY_SUB_ENDERECO=tcp://proxy:5558
    deploy:
      replicas: 2
  
  clientepy:
    build:
      context: .
      dockerfile: ClientePy/Dockerfile
    image: clientepy
    depends_on:
      - servidorpy
      - servidorcs
    environment:
      - SERVIDOR_ENDERECO=tcp://broker:5555
      - PROXY_SUB_ENDERECO=tcp://proxy:5558
    deploy:
      replicas: 2
    